<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Personal Home Assistant</title>
<style>
  :root{
    --bg:#EDEEF1;
    --panel:#FFFFFF;
    --panel-border:#DADCE1;
    --text:#1F2430;
    --text-dim:#71757F;
    --accent:#4F46E5;
    --positive:#159152;
    --negative:#DC2626;
    --mtr-purple:#7C3AED;
    --soon:#DC2626;
    --later:#159152;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;}

  /* ---------- Header strip ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px; border-bottom:1px solid var(--panel-border);
    background:var(--panel);
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--positive);box-shadow:0 0 8px rgba(21,145,82,0.45);}
  .brand h1{font-size:17px; letter-spacing:1.5px; font-weight:700; margin:0; color:var(--accent); text-transform:uppercase;}
  .clock{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right;}
  .clock .time{font-size:26px; font-weight:700; color:var(--text);}
  .clock .date{font-size:13px; color:var(--text-dim); letter-spacing:1px;}

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1px;
    background:var(--panel-border);
  }
  @media (max-width:900px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--panel);
    padding:18px 20px;
    min-height:160px;
    display:flex; flex-direction:column;
  }
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .card-title{font-size:14px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); font-weight:700;}
  .status-dot{width:8px;height:8px;border-radius:50%; flex-shrink:0;}
  .status-ok{background:var(--positive);}
  .status-stale{background:var(--accent);}
  .status-err{background:var(--negative);}
  .card-body{flex:1; display:flex; flex-direction:column; justify-content:center;}
  .big{font-family:var(--mono); font-size:40px; font-weight:700; font-variant-numeric:tabular-nums;}
  .sub{font-size:15px; color:var(--text-dim); margin-top:5px;}
  .row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--panel-border); font-size:16px;}
  .row:last-child{border-bottom:none;}
  .up{color:var(--positive);} .down{color:var(--negative);}
  .dest{color:var(--mtr-purple); font-weight:700;}
  .eta-soon{color:var(--soon); font-weight:700;}
  .eta-later{color:var(--later); font-weight:700;}
  .updated{font-size:12px; color:var(--text-dim); margin-top:10px; font-family:var(--mono);}
  a{color:var(--accent); text-decoration:none;}

  /* Priorities */
  .todo-input{display:flex; gap:6px; margin-bottom:10px;}
  .todo-input input{flex:1; background:#F4F5F7; border:1px solid var(--panel-border); color:var(--text); padding:10px; border-radius:6px; font-size:16px; font-family:var(--sans);}
  .todo-input button{background:var(--accent); border:none; color:#FFFFFF; font-weight:700; padding:10px 14px; border-radius:6px; font-size:16px;}
  .todo-list{list-style:none; margin:0; padding:0; overflow-y:auto; max-height:170px;}
  .todo-item{display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid var(--panel-border); font-size:16px;}
  .todo-item.done .label{text-decoration:line-through; color:var(--text-dim);}
  .todo-item .label{flex:1;}
  .todo-item .del{color:var(--negative); font-size:14px; cursor:pointer; padding:2px 6px;}
  .check{width:20px;height:20px;border:1px solid var(--text-dim);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .check.done{background:var(--positive); border-color:var(--positive); color:#FFFFFF; font-size:13px;}

  /* Arsenal badges */
  .fixture-teams{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .team{display:flex; align-items:center; gap:8px;}
  .team img{width:34px; height:34px; object-fit:contain;}
  .team span{font-size:19px; font-weight:700;}
  .vs{color:var(--text-dim); font-size:15px; font-weight:600;}

  /* 7-day forecast strip */
  .full{grid-column: 1 / -1;}
  .hourly-strip{display:flex; justify-content:space-between; gap:8px;}
  .hour-cell{flex:1; text-align:center; padding:12px 6px; border-radius:10px; background:#F4F5F7; border:1px solid var(--panel-border);}
  .hour-cell .hr{font-size:14px; color:var(--text-dim); font-weight:600;}
  .hour-cell .tmp{font-size:20px; font-weight:700; margin:6px 0; font-family:var(--mono);}
  .hour-cell .tmp-lo{color:var(--text-dim); font-size:15px;}
  .hour-cell .icn{font-size:24px; margin:4px 0;}
  .hour-cell .pop{font-size:13px; color:var(--accent); font-weight:700;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <h1>Personal Home Assistant</h1>
  </div>
  <div class="clock">
    <div class="time" id="clockTime">--:--:--</div>
    <div class="date" id="clockDate">-- --- ----</div>
  </div>
</header>

<div class="grid">

  <!-- WEATHER -->
  <div class="card">
    <div class="card-head"><span class="card-title">Weather &amp; Umbrella</span><span class="status-dot" id="dot-weather"></span></div>
    <div class="card-body" id="weather-body">
      <div class="big">--°</div>
      <div class="sub">Loading…</div>
    </div>
    <div class="updated" id="upd-weather">—</div>
  </div>

  <!-- MTR -->
  <div class="card">
    <div class="card-head"><span class="card-title">MTR Status</span><span class="status-dot" id="dot-mtr"></span></div>
    <div class="card-body" id="mtr-body">
      <div class="sub">Loading…</div>
    </div>
    <div class="updated" id="upd-mtr">—</div>
  </div>

  <!-- ARSENAL -->
  <div class="card">
    <div class="card-head"><span class="card-title">Arsenal Next Fixture</span><span class="status-dot" id="dot-arsenal"></span></div>
    <div class="card-body" id="arsenal-body">
      <div class="sub">Loading…</div>
    </div>
    <div class="updated" id="upd-arsenal">—</div>
  </div>

  <!-- MARKET -->
  <div class="card">
    <div class="card-head"><span class="card-title">US Markets (Overnight)</span><span class="status-dot" id="dot-market"></span></div>
    <div class="card-body" id="market-body">
      <div class="sub">Loading…</div>
    </div>
    <div class="updated" id="upd-market">—</div>
  </div>

  <!-- BUS -->
  <div class="card">
    <div class="card-head"><span class="card-title">Bus Status</span><span class="status-dot" id="dot-bus"></span></div>
    <div class="card-body" id="bus-body">
      <div class="sub">Loading…</div>
    </div>
    <div class="updated" id="upd-bus">—</div>
  </div>

  <!-- PRIORITIES -->
  <div class="card">
    <div class="card-head"><span class="card-title">Today's Priorities</span></div>
    <div class="card-body" style="justify-content:flex-start;">
      <div class="todo-input">
        <input type="text" id="todoInput" placeholder="Add a priority…">
        <button onclick="addTodo()">Add</button>
      </div>
      <ul class="todo-list" id="todoList"></ul>
    </div>
  </div>

  <!-- 7-DAY FORECAST -->
  <div class="card full">
    <div class="card-head"><span class="card-title">7-Day Forecast</span><span class="status-dot" id="dot-hourly"></span></div>
    <div class="card-body" id="hourly-body" style="justify-content:flex-start;">
      <div class="sub">Loading…</div>
    </div>
    <div class="updated" id="upd-hourly">—</div>
  </div>

</div>

<script>
/* =========================================================================
   CONFIG — edit these to match your home station / team / location
   ========================================================================= */
const CONFIG = {
  // Hong Kong coordinates (default: Central). Change if you want a different spot.
  weather: { lat: 22.2793, lon: 114.1628, tz: "Asia/Hong_Kong" },

  // MTR "Next Train" API needs a LINE code + STATION code.
  // Full code list (data dictionary): https://opendata.mtr.com.hk/doc/Next_Train_DataDictionary_v1.7.pdf
  // Example below is Admiralty on the Island Line (ISL / ADM). Edit to your home station.
  mtr: [
    { line: "TKL", sta: "LHP", label: "TKO Ln · LOHAS Park" }
  ],

  // Citybus routes to track (real-time ETA via rt.data.gov.hk).
  // "towards" tells the app which direction you want; stop IDs are auto-discovered and cached.
  bus: [
    { route: "797", from: "LOHAS Park", towards: null, label: "797 · LOHAS Park →" },
    { route: "790", from: "LOHAS Park", towards: null, label: "790 · LOHAS Park →" },
    { route: "790", from: "Wai Lok Street", towards: "LOHAS", label: "790 · Wai Lok St → LOHAS" }
  ],

  // TheSportsDB free-tier key + Arsenal's team ID (133604 is Arsenal FC on TheSportsDB)
  arsenal: { apiKey: "123", teamId: "133604" },

  // Public CORS proxy — needed for the market widget (Yahoo doesn't send CORS headers for browser fetches).
  // If this proxy ever goes down, swap in another (e.g. https://corsproxy.io/?url=)
  corsProxy: "https://api.allorigins.win/raw?url=",

  // Refresh intervals (ms)
  refresh: { weather: 10*60*1000, mtr: 2*60*1000, bus: 2*60*1000, arsenal: 60*60*1000, market: 10*60*1000, hourly: 15*60*1000 }
};

/* ---------- Clock ---------- */
function tickClock(){
  const now = new Date();
  const opts = { timeZone: CONFIG.weather.tz, hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit' };
  document.getElementById('clockTime').textContent = now.toLocaleTimeString('en-GB', opts) + ' HKT';
  document.getElementById('clockDate').textContent = now.toLocaleDateString('en-GB', { timeZone: CONFIG.weather.tz, weekday:'short', day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
}
setInterval(tickClock, 1000); tickClock();

function setStatus(id, state){ const el = document.getElementById('dot-'+id); if(el) el.className = 'status-dot status-'+state; }
function setUpdated(id){ document.getElementById('upd-'+id).textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
async function withTimeout(promise, ms=8000){ return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]); }

/* Cache-busting: append a unique timestamp param so Safari / the CORS proxy can't
   return a stale cached response on each refresh (fixes "time updates but data doesn't"). */
function cacheBust(url){
  var sep = url.indexOf('?') >= 0 ? '&' : '?';
  return url + sep + '_t=' + Date.now();
}
function noCacheFetch(url, ms){
  return withTimeout(fetch(cacheBust(url), { cache: 'no-store' }), ms || 8000);
}

/* ---------- Weather (Open-Meteo, keyless) ---------- */
async function fetchWeather(){
  try{
    const {lat, lon, tz} = CONFIG.weather;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code&daily=precipitation_probability_max,temperature_2m_max,temperature_2m_min&timezone=${encodeURIComponent(tz)}`;
    const res = await noCacheFetch(url);
    const d = await res.json();
    const cur = d.current, day = d.daily;
    const pop = day.precipitation_probability_max[0];
    const needUmbrella = pop >= 40 || cur.precipitation > 0;
    document.getElementById('weather-body').innerHTML = `
      <div class="big">${Math.round(cur.temperature_2m)}°C</div>
      <div class="sub">H ${Math.round(day.temperature_2m_max[0])}° · L ${Math.round(day.temperature_2m_min[0])}° · Rain chance ${pop}%</div>
      <div class="sub" style="margin-top:6px; color:${needUmbrella?'var(--accent)':'var(--positive)'}; font-weight:600;">
        ${needUmbrella ? '☔ Bring an umbrella' : '🌂 No umbrella needed'}
      </div>`;
    setStatus('weather','ok'); setUpdated('weather');
  }catch(e){
    document.getElementById('weather-body').innerHTML = `<div class="sub">Unable to load weather.</div>`;
    setStatus('weather','err');
  }
}

/* ---------- MTR (data.gov.hk Next Train API, keyless) ---------- */
const MTR_STA_NAMES = { NOP:'North Point', TIK:'Tiu Keng Leng', LHP:'LOHAS Park', POA:'Po Lam', QUB:'Quarry Bay', YAT:'Yau Tong', TKO:'Tseung Kwan O', HAH:'Hang Hau' };
function staName(code){ return MTR_STA_NAMES[code] || code; }

async function fetchMTR(){
  const body = document.getElementById('mtr-body');
  try{
    let html = '';
    let anyAlert = false;
    for(const s of CONFIG.mtr){
      const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${s.line}&sta=${s.sta}&lang=en`;
      const res = await noCacheFetch(url);
      const d = await res.json();
      if(d.status === 0){
        anyAlert = true;
        html += `<div class="row"><span>${s.label}</span><span class="down">⚠ Service alert</span></div>`;
        continue;
      }
      const key = `${s.line}-${s.sta}`;
      const node = d.data && d.data[key];
      const trains = [ ...(node && node.UP || []), ...(node && node.DOWN || []) ]
        .sort((a,b) => parseInt(a.ttnt) - parseInt(b.ttnt))
        .slice(0, 4);
      if(!trains.length){
        html += `<div class="row"><span>${s.label}</span><span class="sub">No trains</span></div>`;
      } else {
        trains.forEach(t => {
          const mins = parseInt(t.ttnt);
          const etaClass = mins < 5 ? 'eta-soon' : 'eta-later';
          html += `<div class="row"><span class="dest">→ ${staName(t.dest)}</span><span class="${etaClass}">${mins <= 0 ? 'Departing' : mins + ' min'}</span></div>`;
        });
      }
    }
    body.innerHTML = html || '<div class="sub">No stations configured.</div>';
    setStatus('mtr', anyAlert ? 'stale' : 'ok'); setUpdated('mtr');
  }catch(e){
    body.innerHTML = `<div class="sub">Unable to reach MTR feed. <a href="https://www.mtr.com.hk/en/customer/services/system_status.html" target="_blank">Check status page →</a></div>`;
    setStatus('mtr','err');
  }
}

/* ---------- Bus (Citybus real-time ETA via rt.data.gov.hk, keyless) ----------
   Direction-aware discovery: uses the route's origin/destination to pick the correct
   bound (e.g. "towards LOHAS" = the direction terminating at LOHAS Park), then finds
   the named stop in that direction only. Result cached in localStorage (v2 key). */
async function resolveBusStop(route, fromName, towards){
  const cacheKey = `pt_busstop_v2_${route}_${fromName}_${towards || ''}`;
  const cached = localStorage.getItem(cacheKey);
  if(cached) return JSON.parse(cached);

  // Decide which direction(s) to scan
  let dirs = ['outbound', 'inbound'];
  if(towards){
    try{
      const info = await (await noCacheFetch(`https://rt.data.gov.hk/v2/transport/citybus/route/CTB/${route}`)).json();
      const destEn = (info.data && info.data.dest_en || '').toLowerCase();
      // Citybus convention: outbound = orig -> dest. If the route's listed destination
      // matches "towards", the outbound direction heads there; otherwise it's inbound.
      dirs = destEn.includes(towards.toLowerCase()) ? ['outbound'] : ['inbound'];
    }catch(e){ /* fall back to scanning both */ }
  }

  for(const dir of dirs){
    try{
      const rsUrl = `https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/${dir}`;
      const rs = await (await noCacheFetch(rsUrl)).json();
      const stops = rs.data || [];
      for(const st of stops){
        const infoUrl = `https://rt.data.gov.hk/v2/transport/citybus/stop/${st.stop}`;
        const info = await (await noCacheFetch(infoUrl)).json();
        const name = (info.data && info.data.name_en || '').toLowerCase();
        if(name.includes(fromName.toLowerCase())){
          const found = { stopId: st.stop, dir: dir === 'outbound' ? 'O' : 'I' };
          localStorage.setItem(cacheKey, JSON.stringify(found));
          return found;
        }
      }
    }catch(e){ /* try next direction */ }
  }
  return null;
}

async function fetchBus(){
  const body = document.getElementById('bus-body');
  let html = '';
  let okCount = 0;
  for(const b of CONFIG.bus){
    try{
      const stop = await resolveBusStop(b.route, b.from, b.towards);
      if(!stop){ html += `<div class="row"><span>${b.label}</span><span class="sub">Stop not found</span></div>`; continue; }
      const etaUrl = `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stop.stopId}/${b.route}`;
      const d = await (await noCacheFetch(etaUrl)).json();
      const now = Date.now();
      const etas = (d.data || [])
        .filter(e => e.dir === stop.dir && e.eta)
        .map(e => Math.round((new Date(e.eta) - now) / 60000))
        .filter(m => m >= 0)
        .slice(0, 2);
      let etaHtml;
      if(etas.length){
        etaHtml = etas.map(m => {
          const cls = m < 5 ? 'eta-soon' : 'eta-later';
          return `<span class="${cls}">${m === 0 ? 'Due' : m + 'm'}</span>`;
        }).join('<span class="sub"> · </span>');
      } else {
        etaHtml = '<span class="sub">No ETA</span>';
      }
      html += `<div class="row"><span>${b.label}</span><span>${etaHtml}</span></div>`;
      if(etas.length) okCount++;
    }catch(e){
      html += `<div class="row"><span>${b.label}</span><span class="sub">n/a</span></div>`;
    }
  }
  body.innerHTML = html || '<div class="sub">No routes configured.</div>';
  setStatus('bus', okCount === CONFIG.bus.length ? 'ok' : (okCount > 0 ? 'stale' : 'err'));
  setUpdated('bus');
}

/* ---------- Arsenal (TheSportsDB, free key) ---------- */
async function fetchArsenal(){
  const body = document.getElementById('arsenal-body');
  try{
    const {apiKey, teamId} = CONFIG.arsenal;
    const url = `https://www.thesportsdb.com/api/v1/json/${apiKey}/eventsnext.php?id=${teamId}`;
    const res = await noCacheFetch(url);
    const d = await res.json();
    const ev = d.events && d.events[0];
    if(!ev){ body.innerHTML = '<div class="sub">No upcoming fixture found.</div>'; setStatus('arsenal','stale'); return; }
    const home = ev.strHomeTeam, away = ev.strAwayTeam;
    const homeBadge = ev.strHomeTeamBadge ? `${ev.strHomeTeamBadge}/preview` : '';
    const awayBadge = ev.strAwayTeamBadge ? `${ev.strAwayTeamBadge}/preview` : '';
    const dt = new Date(`${ev.dateEvent}T${ev.strTime || '00:00:00'}Z`);
    const local = dt.toLocaleString('en-GB', { timeZone: CONFIG.weather.tz, weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    const teamHtml = (name, badge) => `<span class="team">${badge ? `<img src="${badge}" alt="" onerror="this.style.display='none'">` : ''}<span>${name}</span></span>`;
    body.innerHTML = `
      <div class="fixture-teams">
        ${teamHtml(home, homeBadge)}
        <span class="vs">vs</span>
        ${teamHtml(away, awayBadge)}
      </div>
      <div class="sub" style="margin-top:8px;">${ev.strLeague || ''}</div>
      <div class="sub" style="margin-top:4px; color:var(--accent); font-weight:600;">${local} HKT</div>`;
    setStatus('arsenal','ok'); setUpdated('arsenal');
  }catch(e){
    body.innerHTML = '<div class="sub">Unable to load fixture data.</div>';
    setStatus('arsenal','err');
  }
}

/* ---------- US Markets (Yahoo v8 chart endpoint — no auth/crumb needed, via CORS proxy) ----------
   v7/quote now requires crumb auth (returns empty anonymously); v8/chart does not.
   Requests are spaced ~600ms apart so the shared CORS proxy doesn't drop rapid calls.
   Syntax kept ES2018-safe for iOS 12 Safari on the iPad Mini 2 (no ?. or ??). */
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

async function fetchOneQuote(symbol){
  var target = 'https://query1.finance.yahoo.com/v8/finance/chart/' + symbol + '?interval=1d&range=1d&_t=' + Date.now();
  var url = CONFIG.corsProxy + encodeURIComponent(target);
  var res = await noCacheFetch(url, 10000);
  var d = await res.json();
  var meta = d && d.chart && d.chart.result && d.chart.result[0] && d.chart.result[0].meta;
  if(!meta || typeof meta.regularMarketPrice !== 'number') throw new Error('no price');
  var price = meta.regularMarketPrice;
  var prevClose = (typeof meta.chartPreviousClose === 'number') ? meta.chartPreviousClose : meta.previousClose;
  var pct = prevClose ? ((price - prevClose) / prevClose * 100) : 0;
  return { price: price, pct: pct };
}

async function fetchMarket(){
  var body = document.getElementById('market-body');
  var symbols = [ {s:'VOO', label:'VOO'}, {s:'TSLA', label:'TSLA'}, {s:'NVDA', label:'NVDA'} ];
  var html = '';
  var okCount = 0;
  for(var i = 0; i < symbols.length; i++){
    var sym = symbols[i];
    var q = null;
    for(var attempt = 0; attempt < 2 && !q; attempt++){
      try { q = await fetchOneQuote(sym.s); }
      catch(e){ if(attempt === 0) await sleep(800); }
    }
    if(q){
      var pctStr = q.pct.toFixed(2);
      var dir = q.pct >= 0 ? 'up' : 'down';
      var priceStr = q.price.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
      html += '<div class="row"><span>' + sym.label + '</span><span class="' + dir + '">' + priceStr + ' (' + (q.pct>=0?'+':'') + pctStr + '%)</span></div>';
      okCount++;
    } else {
      html += '<div class="row"><span>' + sym.label + '</span><span class="sub">n/a</span></div>';
    }
    if(i < symbols.length - 1) await sleep(600); // space out proxy calls
  }
  body.innerHTML = html;
  setStatus('market', okCount === symbols.length ? 'ok' : (okCount > 0 ? 'stale' : 'err'));
  setUpdated('market');
}

/* ---------- 7-Day Forecast (Open-Meteo, keyless — reuses working weather source) ---------- */
const WX_ICON = code => {
  if(code === 0) return '☀️';
  if(code <= 2) return '🌤️';
  if(code === 3) return '☁️';
  if(code <= 48) return '🌫️';
  if(code <= 67) return '🌧️';
  if(code <= 77) return '🌨️';
  if(code <= 82) return '🌦️';
  if(code <= 99) return '⛈️';
  return '🌡️';
};
async function fetchHourly(){
  const body = document.getElementById('hourly-body');
  try{
    const {lat, lon, tz} = CONFIG.weather;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=${encodeURIComponent(tz)}&forecast_days=7`;
    const res = await noCacheFetch(url);
    const d = await res.json();
    const day = d.daily;
    let cells = '';
    for(let i = 0; i < day.time.length; i++){
      const dow = i === 0 ? 'Today' : new Date(day.time[i]).toLocaleDateString('en-GB', { timeZone: tz, weekday:'short' });
      const pop = day.precipitation_probability_max[i];
      cells += `
        <div class="hour-cell">
          <div class="hr">${dow}</div>
          <div class="icn">${WX_ICON(day.weather_code[i])}</div>
          <div class="tmp">${Math.round(day.temperature_2m_max[i])}°<span class="tmp-lo"> / ${Math.round(day.temperature_2m_min[i])}°</span></div>
          <div class="pop">${pop > 0 ? '💧'+pop+'%' : '&nbsp;'}</div>
        </div>`;
    }
    body.innerHTML = `<div class="hourly-strip">${cells}</div>`;
    setStatus('hourly','ok'); setUpdated('hourly');
  }catch(e){
    body.innerHTML = '<div class="sub">Unable to load forecast.</div>';
    setStatus('hourly','err');
  }
}

/* ---------- Priorities (localStorage — persists on this iPad/browser) ---------- */
function loadTodos(){ return JSON.parse(localStorage.getItem('pt_todos') || '[]'); }
function saveTodos(t){ localStorage.setItem('pt_todos', JSON.stringify(t)); }
function renderTodos(){
  const todos = loadTodos();
  const list = document.getElementById('todoList');
  list.innerHTML = todos.map((t, i) => `
    <li class="todo-item ${t.done?'done':''}">
      <span class="check ${t.done?'done':''}" onclick="toggleTodo(${i})">${t.done?'✓':''}</span>
      <span class="label">${t.text}</span>
      <span class="del" onclick="delTodo(${i})">✕</span>
    </li>`).join('');
}
function addTodo(){
  const input = document.getElementById('todoInput');
  if(!input.value.trim()) return;
  const todos = loadTodos();
  todos.push({ text: input.value.trim(), done: false });
  saveTodos(todos); input.value=''; renderTodos();
}
function toggleTodo(i){ const t = loadTodos(); t[i].done = !t[i].done; saveTodos(t); renderTodos(); }
function delTodo(i){ const t = loadTodos(); t.splice(i,1); saveTodos(t); renderTodos(); }
document.getElementById('todoInput').addEventListener('keydown', e => { if(e.key === 'Enter') addTodo(); });
renderTodos();

/* ---------- Boot + refresh loops ---------- */
fetchWeather(); fetchMTR(); fetchBus(); fetchArsenal(); fetchMarket(); fetchHourly();
setInterval(fetchWeather, CONFIG.refresh.weather);
setInterval(fetchMTR, CONFIG.refresh.mtr);
setInterval(fetchBus, CONFIG.refresh.bus);
setInterval(fetchArsenal, CONFIG.refresh.arsenal);
setInterval(fetchMarket, CONFIG.refresh.market);
setInterval(fetchHourly, CONFIG.refresh.hourly);
</script>
